name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build & test
        run: cargo test --workspace
      - name: Dry-run smoke test (en + ko)
        run: |
          cargo run -q --bin build-bot -- x x blueprints/cottage.txt --dry-run
          cargo run -q --bin build-bot -- x x blueprints/cottage.txt --dry-run --lang ko
          cargo run -q --bin build-bot -- x x crates/mc-bot/tests/fixtures/sample.schem --dry-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preview tool smoke test
        run: |
          python tools/preview.py blueprints/cottage.txt -o /tmp/cottage.png
          python tools/preview.py crates/mc-bot/tests/fixtures/sample.schem -o /tmp/sample.png
      - name: Factory generator is reproducible and parses
        run: |
          python tools/gen_factory.py --size small -o /tmp/factory-small.schem
          cmp /tmp/factory-small.schem blueprints/factory-small.schem
          python tools/gen_factory.py --size large -o /tmp/factory-large.schem
          cmp /tmp/factory-large.schem blueprints/factory-large.schem
          cargo run -q --bin build-bot -- x x blueprints/factory-large.schem --dry-run | head -3
